<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Summit Seekers | Live Standings</title><style>
:root{font-family:system-ui,Arial;color:#fff0d7;background:#240d18}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#6d283d,#240d18 75%);min-height:100vh}header{text-align:center;background:#641b32;border-bottom:5px solid #e7b76c;padding:27px 12px}header small{letter-spacing:3px;color:#f5d796;font-weight:800}h1{font-size:clamp(28px,5vw,58px);margin:8px}main{max-width:1140px;margin:auto;padding:18px}.panel{background:#4a2032;border:1px solid #bd8c54;border-radius:15px;padding:18px;margin:16px 0}h2{color:#ffdc9a;margin:0 0 13px}.muted,small{color:#dec7b9}.tabs{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin:15px 0}button{cursor:pointer;background:#713048;color:#fff0d7;border:1px solid #d9a65c;border-radius:9px;padding:10px 16px;font:inherit;font-weight:700}button.active{background:#efbd6e;color:#351322}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.score{display:grid;grid-template-columns:50px 1fr 85px;align-items:center;background:#652c41;border-left:5px solid #e9b667;border-radius:9px;margin:8px 0;padding:13px;gap:12px}.score b:last-child{text-align:right;font-size:25px;color:#ffe0a0}.score small{display:block}.event{border-bottom:1px solid #805064;padding:12px 0}.event:last-child{border:0}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px;border-bottom:1px solid #805064}td:last-child,th:last-child{text-align:right}a{color:#ffdc9a}#status{text-align:center;margin:10px} @media(max-width:720px){.grid{grid-template-columns:1fr}.score{grid-template-columns:35px 1fr 65px}.score b:last-child{font-size:21px}}</style></head><body>
<header><small>CANNON MIDDLE SCHOOL • 2026–27</small><h1>🏔️ SUMMIT SEEKERS</h1><p>Advisory Championship • Live Standings</p></header><main><p id="status" class="muted">Loading championship results…</p><div class="tabs" id="tabs"></div><section class="grid"><div class="panel"><h2>🏁 Last Game</h2><div id="last">—</div></div><div class="panel"><h2>⏭️ Next Game</h2><div id="next">—</div></div></section><section class="panel"><h2 id="heading">Season Standings</h2><div id="standings"></div></section><section class="panel"><h2>🏆 Event Points</h2><div id="history"></div></section><section class="panel"><h2>🗓️ Season Schedule</h2><div id="schedule"></div></section><p class="muted" style="text-align:center">Read-only standings • Refresh to check for new results</p></main>
<script>
const API="https://script.google.com/macros/s/AKfycbzd3vyz4kEVXivvwGY0-B0KicP8aFiejNDLzG1bLsi5_zZtyR7_zpqPr9w4ne8ADiufFg/exec";let state=null,grade=5;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pts=r=>Number(r.points)||0;
const eventDate=e=>new Date(String(e.date).slice(0,10)+'T12:00:00');
const uniqueEvents=()=>{const m=new Map();for(const e of state.events||[]){if(!m.has(e.id))m.set(e.id,{...e,dates:[e.date]});else m.get(e.id).dates.push(e.date)}return [...m.values()].sort((a,b)=>eventDate(a)-eventDate(b))};
function showGrade(g){grade=g;render()}
function render(){if(!state)return;document.getElementById('tabs').innerHTML=[5,6,7,8].map(g=>'<button class="'+(g===grade?'active':'')+'" onclick="showGrade('+g+')">'+g+'th Grade</button>').join('');document.getElementById('heading').textContent=grade+'th Grade • Season Standings';
const standing=(state.standings||[]).filter(r=>Number(r.grade)===grade).sort((a,b)=>b.points-a.points||a.advisory.localeCompare(b.advisory));document.getElementById('standings').innerHTML=standing.length?standing.map((r,i)=>'<div class="score"><strong>#'+(i+1)+'</strong><div><strong>'+esc(r.advisory)+'</strong><small>'+Number(r.events||0)+' events • '+Number(r.bonuses||0)+' shirt bonuses</small></div><b>'+Number(r.points||0)+'</b></div>').join(''):'<p class="muted">Standings are not available yet.</p>';
const events=uniqueEvents(),results=(state.results||[]).filter(r=>Number(r.grade)===grade),completed=events.filter(e=>results.some(r=>r.eventId===e.id||r.event===e.name)),upcoming=events.filter(e=>!completed.some(c=>c.id===e.id));const last=completed.at(-1),next=upcoming[0];const info=e=>e?'<strong>'+esc(e.name)+'</strong><p>'+esc(e.dates.join(' / '))+'</p><small>'+esc(e.notes)+'</small>':'<p class="muted">No recorded event yet.</p>';document.getElementById('last').innerHTML=info(last);document.getElementById('next').innerHTML=next?info(next):'<p class="muted">Season schedule complete.</p>';
document.getElementById('history').innerHTML=completed.length?completed.slice().reverse().map(e=>{const rr=results.filter(r=>r.eventId===e.id||r.event===e.name).sort((a,b)=>pts(b)-pts(a));return '<div class="event"><strong>'+esc(e.name)+'</strong><small> • '+esc(e.dates.join(' / '))+'</small><table><thead><tr><th>Advisory</th><th>Result</th><th>Points</th></tr></thead><tbody>'+rr.map(r=>'<tr><td>'+esc(r.advisory)+'</td><td>'+esc(r.placement)+(r.shirt?' + Shirt':'')+'</td><td>'+pts(r)+'</td></tr>').join('')+'</tbody></table></div>'}).join(''):'<p class="muted">Event results will appear here once they are recorded.</p>';
document.getElementById('schedule').innerHTML=events.map(e=>'<div class="event"><strong>'+esc(e.name)+'</strong><div>'+esc(e.dates.join(' / '))+' • '+esc(e.grades)+'</div><small>'+esc(e.notes)+'</small></div>').join('')}
async function load(){try{const res=await fetch(API,{redirect:'follow'});if(!res.ok)throw Error('HTTP '+res.status);const obj=await res.json();if(!obj.ok||!Array.isArray(obj.events)||!Array.isArray(obj.standings))throw Error('Invalid response');state=obj;document.getElementById('status').textContent='Standings loaded from the Summit Seekers Google Sheet';render()}catch(err){document.getElementById('status').innerHTML='Could not load the live standings. <a href="'+esc(API)+'" target="_blank" rel="noopener">Check the Google Sheet connection</a> and refresh this page.';console.error(err)}}load();
</script></body></html>
