<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Coach Mitchell's Binho League</title><style>:root{font-family:system-ui;background:#141715;color:#f6f2df}body{margin:0}header{background:#29231c;border-bottom:4px solid #d7ab45;padding:22px max(18px,calc((100vw - 1000px)/2))}h1{margin:0;color:#f2c45c}main{max-width:1000px;margin:auto;padding:20px}nav{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}button{cursor:pointer;background:#3d382b;border:1px solid #a68a50;color:#fff;padding:10px 14px;border-radius:8px}button.active{background:#d7ab45;color:#171717}section{background:#242925;border:1px solid #505447;border-radius:12px;padding:18px;margin:18px 0}table{border-collapse:collapse;width:100%}td,th{text-align:left;padding:10px;border-bottom:1px solid #454b42}th{color:#f2c45c}input{width:50px;padding:8px;background:#fff;color:#111;border-radius:5px;border:0}article{display:flex;align-items:center;gap:12px;justify-content:space-between;border-bottom:1px solid #454b42;padding:12px 0;flex-wrap:wrap}.muted{color:#c0c2b8}#notice{color:#f2c45c}a{color:#f2c45c} .bracket-grid{display:flex;gap:14px;overflow-x:auto;padding:10px 0 18px}.bracket-round{flex:1 0 205px;min-width:205px}.bracket-round h3{font-size:1rem;color:#f2c45c}.bracket-game{border:1px solid #806b44;border-radius:8px;margin:12px 0 18px;overflow:hidden;background:#30362f}.bracket-game div{padding:10px;border-bottom:1px solid #505447}.bracket-game div:last-child{border:0}@media(max-width:600px){.bracket-round{flex-basis:185px;min-width:185px}}.tournament-scroll{overflow-x:auto;background:#f8f7f2;border-radius:10px;padding:12px}.tournament-scroll svg{display:block;max-width:none}.bracket-lines path{fill:none;stroke:#242424;stroke-width:1.7}.bracket-labels text{font:15px Arial,sans-serif;fill:#222}.bracket-labels .section-label{font:bold 23px Georgia,serif;fill:#171717}.bracket-labels .game-no{font:13px Arial,sans-serif;fill:#5d3d26}.bracket-labels .entrant{font:14px Arial,sans-serif;fill:#272727}.bracket-labels .footnote{font:16px Arial,sans-serif;fill:#444}.playoff-edit{display:grid;gap:8px}.playoff-match{display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:10px;border:1px solid #5c5b50;border-radius:7px}.playoff-match span{flex:1;min-width:190px}.playoff-match input{width:60px}.playoff-match button:disabled{opacity:.4}</style><header><h1>🏆 BINHO LEAGUE</h1><div>Coach Mitchell's Advisory · 2026–27</div></header><main><p id="notice">Loading league data…</p><nav id="nav"></nav><div id="content"></div></main><script>
const API="https://script.google.com/macros/s/AKfycbyAPUzh_lcM1s5lLH1th8075rIJolH3uTFkpksRxtJQlxabw2pkmH8l7BZeNeuLgIBS/exec";let ADMIN=localStorage.getItem('binho_admin')||'';let data={players:[],schedule:[]},week=1;try{const cached=JSON.parse(localStorage.getItem('binho_cache')||'null');if(cached&&Array.isArray(cached.players)&&Array.isArray(cached.schedule))data=cached}catch(_){}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(){try{let r=await fetch(API);if(!r.ok)throw Error('Server unavailable (HTTP '+r.status+')');data=await r.json();if(!Array.isArray(data.players)||!Array.isArray(data.schedule))throw Error('Unexpected league data');localStorage.setItem('binho_cache',JSON.stringify(data));document.getElementById('notice').textContent='Scores updated from Google Sheets.';render()}catch(e){document.getElementById('notice').textContent='Google connection unavailable. '+(data.schedule.length?'Showing last loaded schedule. ':'')+e.message}}
function standings(){return data.players.map(p=>{let games=data.schedule.filter(m=>m.status==='Final'&&(m.p1===p||m.p2===p));let gf=0,ga=0,w=0;games.forEach(m=>{let own=m.p1===p?+m.s1:+m.s2,other=m.p1===p?+m.s2:+m.s1;gf+=own;ga+=other;if(own>other)w++});return{p,gp:games.length,w,l:games.filter(m=>(m.p1===p?+m.s1:+m.s2)<(m.p1===p?+m.s2:+m.s1)).length,gf,ga,gd:gf-ga}}).sort((a,b)=>b.gf-a.gf||b.gd-a.gd||a.ga-b.ga||a.p.localeCompare(b.p))}
async function saveScore(id){if(!ADMIN){let token=prompt('Enter your admin token to save scores');if(!token)return;ADMIN=token.trim();localStorage.setItem('binho_admin',ADMIN)}let a=document.getElementById('a'+id),b=document.getElementById('b'+id);if(!a||!b||a.value===''||b.value==='')return alert('Enter both scores');const enteredA=Number(a.value),enteredB=Number(b.value);if(!Number.isInteger(enteredA)||!Number.isInteger(enteredB)||enteredA<0||enteredB<0)return alert('Enter valid nonnegative whole-number scores');try{await fetch(API,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify({token:ADMIN,id,s1:+a.value,s2:+b.value})});document.getElementById('notice').textContent='Checking whether Google Sheets saved the score…';setTimeout(async()=>{await load();const match=id[0]==='P'?(data.playoffs||[]).find(m=>m.id===id):data.schedule.find(m=>m.id===id);document.getElementById('notice').textContent=match&&(id[0]==='P'||match.status==='Final')&&Number(match.s1)===enteredA&&Number(match.s2)===enteredB?'Score verified in Google Sheets.':'Could not verify score in Google Sheets. Check the admin token and deployment permissions.'},2200)}catch(e){alert('Score submission failed: '+e.message)}}function match(m){return '<article><span>'+esc(m.p1)+' <b>vs</b> '+esc(m.p2)+'</span><span>'+('<input type="number" min="0" id="a'+esc(m.id)+'" aria-label="First player goals" value="'+(m.status==='Final'?esc(m.s1):'')+'"> – <input type="number" min="0" id="b'+esc(m.id)+'" aria-label="Second player goals" value="'+(m.status==='Final'?esc(m.s2):'')+'"> <button onclick="saveScore(\''+esc(m.id)+'\')">Save score</button>')+'</span></article>'}
function bracketSvg(ranked){
 const results=playoffState();const name=n=>ranked[n-1]?'#'+n+' '+ranked[n-1].p:'#'+n+' TBD';const slot=ref=>results[Number(ref.slice(1))]?.[ref[0]==='W'?'winner':'loser']||ref;
 const labels=[];
 const paths=[];
 const text=(x,y,s,cls='')=>labels.push('<text x="'+x+'" y="'+y+'" class="'+cls+'">'+esc(s)+'</text>');
 const line=(x1,y1,x2,y2,dashed=false)=>paths.push('<path d="M'+x1+' '+y1+' L'+x2+' '+y2+'"'+(dashed?' stroke-dasharray="7 5"':'')+'/>');
 const pair=(x,y1,y2,toX,n,a,b)=>{line(x,y1,toX,y1);line(x,y2,toX,y2);line(toX,y1,toX,y2);text(x+3,y1-7,a,'entrant');text(x+3,y2-7,b,'entrant');text(toX+5,(y1+y2)/2-4,'('+n+')','game-no')};
 const join=(x,y1,y2,toX,n)=>{line(x,y1,toX,y1);line(x,y2,toX,y2);line(toX,y1,toX,y2);text(toX+5,(y1+y2)/2-4,'('+n+')','game-no')};
 text(20,30,'WINNERS BRACKET','section-label');text(20,690,'LOSERS BRACKET','section-label');
 pair(24,120,160,185,1,name(8),name(9));
 pair(24,430,470,185,2,name(7),name(10));
 pair(185,100,200,350,3,name(1),slot('W1'));
 pair(185,250,330,350,5,name(4),name(5));
 pair(185,410,510,350,6,name(2),slot('W2'));
 pair(185,560,640,350,4,name(3),name(6));
 join(350,150,290,555,11);join(350,460,600,555,12);
 join(555,220,530,770,15);
 line(770,375,980,375);line(980,375,980,880);text(985,630,'(18)','game-no');
 pair(160,770,810,320,7,slot('L2'),slot('L5'));
 pair(160,1040,1080,320,8,slot('L1'),slot('L6'));
 pair(320,790,900,475,9,slot('W7'),slot('L3'));
 pair(320,980,1060,475,10,slot('L4'),slot('W8'));
 pair(475,845,940,635,13,slot('W9'),slot('L12'));
 pair(475,1010,1100,635,14,slot('W10'),slot('L11'));
 join(635,890,1055,790,16);
 line(790,972,900,972);text(800,955,'W16','entrant');
 line(900,880,980,880);line(900,972,900,880);text(905,875,'(17)','game-no');
 line(980,880,1110,880);line(1110,375,1110,880);text(1117,630,'(19) GRAND FINAL','game-no');
 line(1110,630,1235,630,true);line(1235,630,1235,810,true);text(1115,800,'RESET IF NECESSARY','entrant');
 text(35,1160,'First loss sends a player to the lower bracket; second loss eliminates them.','footnote');
 return '<svg viewBox="0 0 1320 1190" width="1320" height="1190" role="img" aria-label="Ten player double elimination bracket with connected winner and loser match paths"><g class="bracket-lines">'+paths.join('')+'</g><g class="bracket-labels">'+labels.join('')+'</g></svg>';
}
function render(){let nav=document.getElementById('nav');nav.innerHTML='<button data-week="0">Leaderboard</button>'+Array.from({length:9},(_,i)=>'<button data-week="'+(i+1)+'">Week '+(i+1)+'</button>').join('')+'<button data-week="10">Championship</button>';nav.querySelectorAll('button').forEach(b=>{b.classList.toggle('active',+b.dataset.week===week);b.onclick=()=>{week=+b.dataset.week;render()}});let out='';if(week===0){out='<section><h2>League Table</h2><table><thead><tr><th>#</th><th>Player</th><th>GP</th><th>W</th><th>L</th><th>GF / PTS</th><th>GA</th><th>GD</th></tr></thead><tbody>'+standings().map((x,i)=>'<tr><td>'+(i+1)+'</td><td>'+esc(x.p)+'</td><td>'+x.gp+'</td><td>'+x.w+'</td><td>'+x.l+'</td><td><b>'+x.gf+'</b></td><td>'+x.ga+'</td><td>'+x.gd+'</td></tr>').join('')+'</tbody></table></section>'}else if(week<=9){let current=data.schedule.filter(m=>+m.week===week),makeups=data.schedule.filter(m=>+m.week<week&&m.status!=='Final');const playing=new Set(current.flatMap(m=>[m.p1,m.p2]));const byes=data.players.filter(p=>!playing.has(p));out='<section><h2>Week '+week+'</h2>'+(current.map(match).join('')||'<p>Connect the Sheet to display matches.</p>')+(current.length&&byes.length?'<p class="muted"><strong>Bye:</strong> '+byes.map(esc).join(', ')+'</p>':'')+'</section><section><h2>Make-up Games</h2>'+(makeups.map(m=>'<p class="muted">Week '+m.week+'</p>'+match(m)).join('')||'<p>No outstanding makeup games.</p>')+'</section>'}else{out='<section><h2>🏆 10-Player Double Elimination</h2><p>Traditional connected bracket, with the winners bracket above and the elimination bracket below. Names reflect current standings; seeds lock after the regular season.</p><p class="muted">Scroll horizontally to follow the full bracket. W = winner of numbered match, L = loser. Dashed line indicates a possible championship reset.</p><div class="tournament-scroll">'+bracketSvg(standings())+'</div>'+playoffEditor()+'</section>'}document.getElementById('content').innerHTML=out}
document.querySelector('header').insertAdjacentHTML('beforeend','<button id="setup" style="margin-top:12px">⚙ Admin token</button>');document.getElementById('setup').onclick=()=>{let token=prompt('Admin token (leave blank for read-only)',ADMIN);if(token!==null)localStorage.setItem('binho_admin',token.trim());location.reload()};render();load();</script><script src="playoffs.js"></script></html>
