<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Coach Mitchell's Binho League</title><style>:root{font-family:system-ui;background:#141715;color:#f6f2df}body{margin:0}header{background:#29231c;border-bottom:4px solid #d7ab45;padding:22px max(18px,calc((100vw - 1000px)/2))}h1{margin:0;color:#f2c45c}main{max-width:1000px;margin:auto;padding:20px}nav{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}button{cursor:pointer;background:#3d382b;border:1px solid #a68a50;color:#fff;padding:10px 14px;border-radius:8px}button.active{background:#d7ab45;color:#171717}section{background:#242925;border:1px solid #505447;border-radius:12px;padding:18px;margin:18px 0}table{border-collapse:collapse;width:100%}td,th{text-align:left;padding:10px;border-bottom:1px solid #454b42}th{color:#f2c45c}input{width:50px;padding:8px;background:#fff;color:#111;border-radius:5px;border:0}article{display:flex;align-items:center;gap:12px;justify-content:space-between;border-bottom:1px solid #454b42;padding:12px 0;flex-wrap:wrap}.muted{color:#c0c2b8}#notice{color:#f2c45c}a{color:#f2c45c} .bracket-grid{display:flex;gap:14px;overflow-x:auto;padding:10px 0 18px}.bracket-round{flex:1 0 205px;min-width:205px}.bracket-round h3{font-size:1rem;color:#f2c45c}.bracket-game{border:1px solid #806b44;border-radius:8px;margin:12px 0 18px;overflow:hidden;background:#30362f}.bracket-game div{padding:10px;border-bottom:1px solid #505447}.bracket-game div:last-child{border:0}@media(max-width:600px){.bracket-round{flex-basis:185px;min-width:185px}}</style><header><h1>🏆 BINHO LEAGUE</h1><div>Coach Mitchell's Advisory · 2026–27</div></header><main><p id="notice">Loading league data…</p><nav id="nav"></nav><div id="content"></div></main><script>
const API="https://script.google.com/macros/s/AKfycbyAPUzh_lcM1s5lLH1th8075rIJolH3uTFkpksRxtJQlxabw2pkmH8l7BZeNeuLgIBS/exec";let ADMIN=localStorage.getItem('binho_admin')||'';let data={players:[],schedule:[]},week=1;try{const cached=JSON.parse(localStorage.getItem('binho_cache')||'null');if(cached&&Array.isArray(cached.players)&&Array.isArray(cached.schedule))data=cached}catch(_){}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(){try{let r=await fetch(API);if(!r.ok)throw Error('Server unavailable (HTTP '+r.status+')');data=await r.json();if(!Array.isArray(data.players)||!Array.isArray(data.schedule))throw Error('Unexpected league data');localStorage.setItem('binho_cache',JSON.stringify(data));document.getElementById('notice').textContent='Scores updated from Google Sheets.';render()}catch(e){document.getElementById('notice').textContent='Google connection unavailable. '+(data.schedule.length?'Showing last loaded schedule. ':'')+e.message}}
function standings(){return data.players.map(p=>{let games=data.schedule.filter(m=>m.status==='Final'&&(m.p1===p||m.p2===p));let gf=0,ga=0,w=0;games.forEach(m=>{let own=m.p1===p?+m.s1:+m.s2,other=m.p1===p?+m.s2:+m.s1;gf+=own;ga+=other;if(own>other)w++});return{p,gp:games.length,w,l:games.filter(m=>(m.p1===p?+m.s1:+m.s2)<(m.p1===p?+m.s2:+m.s1)).length,gf,ga,gd:gf-ga}}).sort((a,b)=>b.gf-a.gf||b.gd-a.gd||a.ga-b.ga||a.p.localeCompare(b.p))}
async function saveScore(id){if(!ADMIN){let token=prompt('Enter your admin token to save scores');if(!token)return;ADMIN=token.trim();localStorage.setItem('binho_admin',ADMIN)}let a=document.getElementById('a'+id),b=document.getElementById('b'+id);if(!a||!b||a.value===''||b.value==='')return alert('Enter both scores');const enteredA=Number(a.value),enteredB=Number(b.value);if(!Number.isInteger(enteredA)||!Number.isInteger(enteredB)||enteredA<0||enteredB<0)return alert('Enter valid nonnegative whole-number scores');try{await fetch(API,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify({token:ADMIN,id,s1:+a.value,s2:+b.value})});document.getElementById('notice').textContent='Checking whether Google Sheets saved the score…';setTimeout(async()=>{await load();const match=data.schedule.find(m=>m.id===id);document.getElementById('notice').textContent=match&&match.status==='Final'&&Number(match.s1)===enteredA&&Number(match.s2)===enteredB?'Score verified in Google Sheets.':'Could not verify score in Google Sheets. Check the admin token and deployment permissions.'},2200)}catch(e){alert('Score submission failed: '+e.message)}}function match(m){return '<article><span>'+esc(m.p1)+' <b>vs</b> '+esc(m.p2)+'</span><span>'+('<input type="number" min="0" id="a'+esc(m.id)+'" aria-label="First player goals" value="'+(m.status==='Final'?esc(m.s1):'')+'"> – <input type="number" min="0" id="b'+esc(m.id)+'" aria-label="Second player goals" value="'+(m.status==='Final'?esc(m.s2):'')+'"> <button onclick="saveScore(\''+esc(m.id)+'\')">Save score</button>')+'</span></article>'}
function render(){let nav=document.getElementById('nav');nav.innerHTML='<button data-week="0">Leaderboard</button>'+Array.from({length:9},(_,i)=>'<button data-week="'+(i+1)+'">Week '+(i+1)+'</button>').join('')+'<button data-week="10">Championship</button>';nav.querySelectorAll('button').forEach(b=>{b.classList.toggle('active',+b.dataset.week===week);b.onclick=()=>{week=+b.dataset.week;render()}});let out='';if(week===0){out='<section><h2>League Table</h2><table><thead><tr><th>#</th><th>Player</th><th>GP</th><th>W</th><th>L</th><th>GF / PTS</th><th>GA</th><th>GD</th></tr></thead><tbody>'+standings().map((x,i)=>'<tr><td>'+(i+1)+'</td><td>'+esc(x.p)+'</td><td>'+x.gp+'</td><td>'+x.w+'</td><td>'+x.l+'</td><td><b>'+x.gf+'</b></td><td>'+x.ga+'</td><td>'+x.gd+'</td></tr>').join('')+'</tbody></table></section>'}else if(week<=9){let current=data.schedule.filter(m=>+m.week===week),makeups=data.schedule.filter(m=>+m.week<week&&m.status!=='Final');const playing=new Set(current.flatMap(m=>[m.p1,m.p2]));const byes=data.players.filter(p=>!playing.has(p));out='<section><h2>Week '+week+'</h2>'+(current.map(match).join('')||'<p>Connect the Sheet to display matches.</p>')+(current.length&&byes.length?'<p class="muted"><strong>Bye:</strong> '+byes.map(esc).join(', ')+'</p>':'')+'</section><section><h2>Make-up Games</h2>'+(makeups.map(m=>'<p class="muted">Week '+m.week+'</p>'+match(m)).join('')||'<p>No outstanding makeup games.</p>')+'</section>'}else{const ranked=standings();const seeded=n=>ranked[n-1]?'<strong>#'+n+'</strong> '+esc(ranked[n-1].p):'#'+n+' · TBD';const game=(a,b)=>'<div class="bracket-game"><div>'+a+'</div><div>'+b+'</div></div>';const round=(title,games)=>'<div class="bracket-round"><h3>'+title+'</h3>'+games.join('')+'</div>';out='<section><h2>🏆 Championship Bracket</h2><p>10 players · Double elimination · Seeding follows the current leaderboard (total goals scored). Each player must lose twice to be eliminated.</p><p class="muted">Preview only: seeds will be locked after all 45 regular-season games are complete. The bracket does not yet record playoff results.</p><h3>Winners Bracket</h3><div class="bracket-grid">'+round('Opening round',[game(seeded(8),seeded(9)),game(seeded(7),seeded(10))]) +round('Quarterfinals',[game(seeded(1),'Winner 8 vs 9'),game(seeded(4),seeded(5)),game(seeded(3),seeded(6)),game(seeded(2),'Winner 7 vs 10')])+round('Semifinals',[game('Winner QF1','Winner QF2'),game('Winner QF3','Winner QF4')])+round('Winners final',[game('Winner SF1','Winner SF2')])+'</div><h3>Losers Bracket</h3><p class="muted">Teams move here after their first loss. Matchups will be filled as winners-bracket results arrive; a second loss eliminates a team.</p><div class="bracket-grid">'+round('Elimination rounds',[game('Losers / winners advance','TBD'),game('Losers / winners advance','TBD')])+round('Losers final',[game('Remaining contender','Remaining contender')])+'</div><h3>Grand Final</h3>'+game('Winners-bracket champion','Losers-bracket champion')+'<p class="muted">If the losers-bracket champion wins the first grand final, a reset match is played because both finalists then have one loss.</p></section>'}document.getElementById('content').innerHTML=out}
document.querySelector('header').insertAdjacentHTML('beforeend','<button id="setup" style="margin-top:12px">⚙ Admin token</button>');document.getElementById('setup').onclick=()=>{let token=prompt('Admin token (leave blank for read-only)',ADMIN);if(token!==null)localStorage.setItem('binho_admin',token.trim());location.reload()};render();load();</script></html>
