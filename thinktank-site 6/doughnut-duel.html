<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Doughnut Duel | Cannon Middle</title><style>
:root{font-family:system-ui,Arial;background:#230c16;color:#fff3dc}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#682138,#230c16 75%);min-height:100vh}header{text-align:center;padding:22px 12px;background:#65172e;border-bottom:6px solid #d9a84e}header small{letter-spacing:3px;color:#f4d99a;font-weight:800}h1{font-size:clamp(32px,6vw,70px);margin:4px;text-shadow:3px 4px #30111d}header p{margin:5px}main{max-width:1300px;margin:auto;padding:20px}button,input{font:inherit}button{cursor:pointer;border:1px solid #d3a25b;border-radius:9px;padding:10px 14px;background:#6b2439;color:#fff3dc;font-weight:700}button:hover{background:#93435a}button.active,.primary{background:#e9b55d;color:#381421}.tabs,.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:14px 0}.tabs button{font-size:20px;min-width:100px}.cols{display:grid;grid-template-columns:1fr 1fr;gap:18px}.panel{background:#451a2c;border:2px solid #a77846;border-radius:14px;padding:16px;box-shadow:0 6px 20px #16060a66}h2{color:#ffd58b;margin:0 0 12px;text-transform:uppercase;letter-spacing:1px}.entry{display:flex;align-items:center;gap:9px;background:#61253a;margin:6px 0;padding:9px;border-radius:8px}.entry strong{flex:1}.entry .num{color:#ffd58b;min-width:27px}.entry input{width:90px;padding:8px;background:#fff6e9;border:0;border-radius:6px;color:#2e1520}.rank{display:flex;justify-content:space-between;gap:8px;background:#672a3b;padding:14px;margin:8px 0;border-left:5px solid #e5b460;border-radius:8px}.rank:first-of-type{background:#85512f}.muted{color:#e7c9bf}.bracket{display:grid;grid-template-columns:1fr 1fr;gap:15px}.match{background:#61253a;padding:12px;border-radius:10px}.match button{display:block;width:100%;margin:8px 0;text-align:left}.champ{text-align:center;margin-top:16px;padding:18px;border:2px solid #e5b460;border-radius:12px}.champ button{margin:5px}.selected{background:#e5b460;color:#321422}footer{text-align:center;padding:20px;color:#d6b8aa}body.display .admin{display:none}body.display main{max-width:1600px}body.display .entry{font-size:1.15em}body.display .rank{font-size:1.3em}@media(max-width:700px){.cols,.bracket{grid-template-columns:1fr}.tabs button{min-width:65px}}
</style><header><small>CANNON MIDDLE SCHOOL • SUMMIT SEEKERS 2026–27</small><h1>🍩 DOUGHNUT DUEL 🎯</h1><p>FOAM DARTS • FLYING DOUGHNUTS • ONE CHAMPION</p></header><main><div class="tabs" id="grades"></div><div class="actions"><button id="qualBtn" onclick="phase='qual';render()">🎯 Qualifying</button><button id="brBtn" onclick="phase='bracket';render()">🏆 Final Four</button><button onclick="document.body.classList.toggle('display');this.textContent=document.body.classList.contains('display')?'✏️ Admin mode':'📺 Display mode'">📺 Display mode</button></div><div id="screen"></div></main><footer>SUMMIT SEEKERS • AIM HIGH • WORK TOGETHER • REACH THE TOP</footer><script>
const roster={'5':['Bresalier','Goggins','Grady','Grier','Mattsson','Stephens','Watson'],'6':['Hayes',"O'Brien",'Sherrill','Fox','Sandlof','Hughes','Jones','L. Burlington'],'7':['Cooke','Mitchell','Weakland','Marks','Nash','Northrup','Tsuchiyama','Gardin'],'8':['Powers','Walsh','Burlington','Sun','Lee','Colacion','Macdonald','Carney']};
const key='cannon-doughnut-duel-v1';let data;try{data=JSON.parse(localStorage.getItem(key))||{}}catch(e){data={}};let grade='5',phase='qual';
for(const g of Object.keys(roster)){if(!data[g])data[g]={order:[...roster[g]],times:{},seeds:null,semi:[null,null],champ:null}}
const save=()=>localStorage.setItem(key,JSON.stringify(data));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ranked=()=>roster[grade].filter(n=>data[grade].times[n]!==undefined&&data[grade].times[n]!==''&&Number.isFinite(+data[grade].times[n])&&+data[grade].times[n]>=0).sort((a,b)=>+data[grade].times[a]-+data[grade].times[b]);
function change(g){grade=g;phase='qual';render()}
function shuffle(){let a=data[grade].order;for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}save();render()}
function setTime(n,v){if(v!==''&&(!Number.isFinite(+v)||+v<0))return;data[grade].times[n]=v;data[grade].seeds=null;data[grade].semi=[null,null];data[grade].champ=null;save();render()}
function lock(){let r=ranked();if(r.length!==roster[grade].length){alert('Enter all qualifying times first.');return}if(+data[grade].times[r[3]]===+data[grade].times[r[4]]){alert('Resolve the fourth-place tie before locking.');return}data[grade].seeds=r.slice(0,4);data[grade].semi=[null,null];data[grade].champ=null;save();phase='bracket';render()}
function semi(i,n){data[grade].semi[i]=n;data[grade].champ=null;save();render()}
function champ(n){data[grade].champ=n;save();render()}
function exportData(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='doughnut-duel-backup.json';a.click();URL.revokeObjectURL(a.href)}
function importData(el){const f=el.files[0];if(!f)return;f.text().then(t=>{try{const obj=JSON.parse(t);if(!Object.keys(roster).every(g=>Array.isArray(obj[g]?.order)))throw Error();if(confirm('Replace all current results with this backup?')){data=obj;save();render()}}catch(e){alert('Invalid scoreboard backup')}})}
function render(){const d=data[grade],r=ranked();document.getElementById('grades').innerHTML=Object.keys(roster).map(g=>'<button class="'+(grade===g?'active':'')+'" onclick="change(\''+g+'\')">'+g+'th Grade</button>').join('');document.getElementById('qualBtn').className=phase==='qual'?'active':'';document.getElementById('brBtn').className=phase==='bracket'?'active':'';
if(phase==='qual'){document.getElementById('screen').innerHTML='<div class="cols"><section class="panel"><h2>🎯 Firing Order</h2>'+d.order.map((n,i)=>'<div class="entry"><span class="num">'+(i+1)+'.</span><strong>'+esc(n)+'</strong><input aria-label="Seconds for '+esc(n)+'" type="number" min="0" step="0.01" placeholder="seconds" value="'+esc(d.times[n]??'')+'" onchange="setTime('+JSON.stringify(n).replace(/"/g,'&quot;')+',this.value)"></div>').join('')+'<div class="actions admin"><button class="primary" onclick="shuffle()">🔀 Shuffle order</button></div></section><section class="panel"><h2>🏆 Top Four</h2>'+(r.slice(0,4).map((n,i)=>'<div class="rank"><strong>#'+(i+1)+' '+esc(n)+'</strong><strong>'+(+d.times[n]).toFixed(2)+' s</strong></div>').join('')||'<p class="muted">Awaiting qualifying times</p>')+'<p>'+r.length+' of '+roster[grade].length+' times recorded</p><div class="admin"><button class="primary" onclick="lock()" '+(r.length!==roster[grade].length?'disabled':'')+'>Lock Final Four →</button></div></section></div><div class="actions admin"><button onclick="exportData()">⬇ Export backup</button><label style="padding:10px;border:1px solid #d3a25b;border-radius:9px">⬆ Import backup <input type="file" accept=".json" onchange="importData(this)" style="max-width:160px"></label></div>'}
else if(!d.seeds){document.getElementById('screen').innerHTML='<section class="panel"><h2>🏆 Final Four</h2><p>Finish qualifying and lock the four fastest advisories to start the bracket.</p></section>'}
else{const pairs=[[d.seeds[0],d.seeds[3]],[d.seeds[1],d.seeds[2]]];document.getElementById('screen').innerHTML='<section class="panel"><h2>🏆 '+grade+'th Grade Championship Bracket</h2><div class="bracket">'+pairs.map((p,i)=>'<div class="match"><h3>Semifinal '+(i+1)+'</h3>'+p.map(n=>'<button class="'+(d.semi[i]===n?'selected':'')+'" onclick="semi('+i+','+JSON.stringify(n).replace(/"/g,'&quot;')+')">'+esc(n)+(d.semi[i]===n?' ✓':'')+'</button>').join('')+'</div>').join('')+'</div><div class="champ"><h2>🍩 THE FINAL DUEL</h2>'+(d.semi.every(Boolean)?d.semi.map(n=>'<button class="'+(d.champ===n?'selected':'')+'" onclick="champ('+JSON.stringify(n).replace(/"/g,'&quot;')+')">'+esc(n)+'</button>').join(''):'<p>Choose both semifinal winners</p>')+(d.champ?'<h2>🏆 '+esc(d.champ)+' WINS!</h2>':'')+'</div></section>'}}
render();
</script></html>
